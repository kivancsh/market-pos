# Optiva e-posta servisi — Cloudflare Worker
# Kurulum adımları: mail-service/README.md
name = "optiva-mail"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

[vars]
# Resend'de doğrulanmış alan adınızdaki gönderen adres
FROM_ADDRESS = "Optiva <bildirim@ALAN-ADINIZ.com>"

# wrangler kv namespace create KV  → çıkan id'yi buraya yazın
[[kv_namespaces]]
binding = "KV"
id = "KV_NAMESPACE_ID"

# Gizli anahtarlar (buraya YAZILMAZ): npx wrangler secret put RESEND_API_KEY
# İsteğe bağlı bulut yapay zekâ: npx wrangler secret put ANTHROPIC_API_KEY
