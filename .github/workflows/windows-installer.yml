# Windows kurulum dosyası (Optiva-Setup.exe)
# GitHub'ın Windows bilgisayarında: testler → derleme → paket → kurulum dosyası → gerçek kurulum testi → yayın.
# Sonuç her zaman şu adresten indirilebilir:
#   https://github.com/<kullanıcı>/<repo>/releases/latest/download/Optiva-Setup.exe
name: Windows kurulum dosyası

on:
  push:
    branches: [main]
    # Kılavuz/video/belge değişiklikleri kurulum dosyasını etkilemez; windows/ altındaki her şey (sürüm notu dahil) yeniden üretir.
    paths: ["**", "!docs/**", "!promo/**", "!**/*.md", "windows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Sürüm numarası (package.json'daki ilk iki sayı + derleme no)
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}
          echo "MARKET_KASA_VERSION=$v" >> "$GITHUB_ENV"
          echo "Sürüm: $v"

      - name: Paketleri kur
        run: npm ci

      - name: Testler (Windows'ta)
        timeout-minutes: 15
        run: npm test

      - name: Uygulamayı derle (kendi kendine yeten sunucu)
        run: npm run build
        env:
          NEXT_OUTPUT: standalone

      - name: Paket dosyalarını topla
        run: node windows/build.mjs

      - name: Uygulama penceresi bileşeni (Microsoft Edge WebView2, NuGet)
        shell: pwsh
        run: |
          $versions = (Invoke-RestMethod https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/index.json).versions | Where-Object { $_ -notmatch '-' }
          $v = $versions[-1]
          Write-Host "WebView2 SDK $v"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$v/microsoft.web.webview2.$v.nupkg" -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2 -Force
          foreach ($n in @('Microsoft.Web.WebView2.Core.dll', 'Microsoft.Web.WebView2.WinForms.dll')) {
            $f = Get-ChildItem wv2\lib -Recurse -Filter $n | Where-Object { $_.FullName -match '\\net4' } | Select-Object -First 1
            if (-not $f) { Write-Host "::error::$n bulunamadı"; exit 1 }
            Copy-Item $f.FullName build\win\
          }
          Copy-Item wv2\runtimes\win-x64\native\WebView2Loader.dll build\win\

      - name: Uygulamayı derle (Optiva.exe)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /codepage:65001 /target:winexe /optimize+ /platform:anycpu `
            /win32icon:windows\MarketKasa.ico "/out:build\win\Optiva.exe" `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            /r:build\win\Microsoft.Web.WebView2.Core.dll /r:build\win\Microsoft.Web.WebView2.WinForms.dll `
            windows\launcher\MarketKasa.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Kurulum dosyasını oluştur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          & $iscc /Qp "/DAppVersion=$env:MARKET_KASA_VERSION" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item build\dist\Optiva-Setup.exe | Format-List Name, Length

      - name: Mac paketi (Optiva-Mac.zip — Mac kurulumu ve Mac güncellemesi)
        shell: bash
        run: |
          mkdir -p build/mac
          node -e "require('fs').writeFileSync('build/mac/version.json', JSON.stringify({ version: process.env.MARKET_KASA_VERSION, channel: 'mac', commit: process.env.GITHUB_SHA, builtAt: new Date().toISOString() }, null, 1))"
          # Proje dosyaları (tanıtım videosu hariç) + version.json; kişisel dosyalar depoda zaten yok
          # autocrlf kapalı: Windows'ta satır sonları CRLF'e çevrilirse Mac betikleri (.sh, .command) çalışmaz
          git -c core.autocrlf=false -c core.eol=lf archive --format=zip --prefix=market-pos/ --add-file=build/mac/version.json \
            -o build/dist/Optiva-Mac.zip HEAD -- . ':(exclude)promo'
          python windows/check-mac-zip.py build/dist/Optiva-Mac.zip

      - name: En son sürüm bilgisi (latest.json — programlar güncellemeyi buradan öğrenir)
        shell: bash
        run: node windows/write-latest.mjs build/dist/Optiva-Setup.exe build/dist/latest.json "$(git log -1 --format=%s)" build/dist/Optiva-Mac.zip

      - name: Gerçek kurulum testi (kur, aç, kullan, kaldır)
        timeout-minutes: 15
        shell: pwsh
        run: ./windows/smoke-test.ps1

      - name: Kurulum dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: Optiva-Setup
          path: build/dist/Optiva-Setup.exe
          retention-days: 30

      - name: Yayınla (Releases → en son sürüm)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows -y --cleanup-tag || true
          # Ad değişikliği (Market Kasa → Optiva): 1.1.27 ve öncesi güncellemeyi eski dosya adlarıyla indirir; aynı dosyalar o adlarla da yayınlanır
          cp build/dist/Optiva-Setup.exe build/dist/Market-Kasa-Setup.exe
          cp build/dist/Optiva-Mac.zip build/dist/Market-Kasa-Mac.zip
          gh release create windows build/dist/Optiva-Setup.exe build/dist/Optiva-Mac.zip build/dist/latest.json \
            build/dist/Market-Kasa-Setup.exe build/dist/Market-Kasa-Mac.zip \
            --target "$GITHUB_SHA" \
            --title "Optiva $MARKET_KASA_VERSION — Windows ve Mac" \
            --notes-file windows/RELEASE_NOTES.md \
            --latest
