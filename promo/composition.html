<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Market Kasa Tanıtım</title>
<style>
  :root { --em: #10b981; --em2: #059669; --em3: #34d399; --amber: #f59e0b; --ink: #070d1a; --slate: #cbd5e1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #04070e; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .layer { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; width: 1100px; height: 1100px; }
  .grid { position: absolute; inset: -200px; background-image: linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px); background-size: 80px 80px; -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%); }
  .dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #a7f3d0; box-shadow: 0 0 12px #34d399; }

  /* kinetik metin */
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.02em 0.14em; margin-bottom: -0.1em; }
  .wi { display: inline-block; will-change: transform; }
  .grad { background: linear-gradient(90deg, #34d399, #10b981 45%, #fbbf24); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* tarayıcı çerçevesi */
  .persp { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 50%; }
  .browser { position: absolute; border-radius: 20px; background: #fff; overflow: hidden; box-shadow: 0 50px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08), 0 0 140px rgba(16,185,129,.18); transform-origin: 50% 50%; }
  .bar { height: 46px; background: linear-gradient(#f1f4f8, #e7ebf1); display: flex; align-items: center; gap: 9px; padding: 0 18px; border-bottom: 1px solid #d9dee6; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .url { margin-left: 26px; height: 28px; flex: 1; max-width: 520px; border-radius: 9px; background: #fff; color: #475569; font-size: 15px; display: flex; align-items: center; padding: 0 12px; gap: 8px; box-shadow: inset 0 0 0 1px #dfe3ea; }
  .url b { color: #0f172a; font-weight: 600; }
  .vp { position: relative; overflow: hidden; background: #f1f5f9; }
  .cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
  .cam img { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; }
  .ov { position: absolute; inset: 0; pointer-events: none; }
  .ring { position: absolute; border: 4px solid var(--em); border-radius: 14px; box-shadow: 0 0 0 6px rgba(16,185,129,.18), 0 0 30px rgba(16,185,129,.55); }
  .ring.amber { border-color: var(--amber); box-shadow: 0 0 0 6px rgba(245,158,11,.2), 0 0 30px rgba(245,158,11,.55); }
  .cursor { position: absolute; width: 34px; height: 44px; transform-origin: 4px 4px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
  .ripple { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 3px solid var(--em); }

  /* adım başlıkları */
  .cap { position: absolute; width: 470px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px; border-radius: 999px; background: rgba(16,185,129,.16); border: 1px solid rgba(52,211,153,.45); color: #6ee7b7; font-weight: 800; letter-spacing: .14em; font-size: 16px; }
  .pill .n { width: 26px; height: 26px; border-radius: 50%; background: var(--em); color: #04120c; display: grid; place-items: center; letter-spacing: 0; font-size: 15px; }
  .ctitle { font-size: 68px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; margin-top: 22px; }
  .csub { font-size: 27px; line-height: 1.38; color: var(--slate); margin-top: 22px; font-weight: 450; }
  .bigdigit { position: absolute; font-size: 640px; font-weight: 900; line-height: 1; color: transparent; -webkit-text-stroke: 2px rgba(52,211,153,.13); letter-spacing: -0.05em; }

  .chip { position: absolute; display: flex; align-items: center; gap: 14px; height: 70px; padding: 0 28px 0 18px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); font-size: 30px; font-weight: 700; white-space: nowrap; backdrop-filter: blur(6px); }
  .chip .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #10b981, #047857); }

  .label { position: absolute; width: 470px; height: 250px; border-radius: 22px; background: #fff; color: #0f172a; box-shadow: 0 30px 60px rgba(0,0,0,.45); padding: 22px 26px; overflow: hidden; }
  .label .ln { font-size: 22px; font-weight: 700; }
  .label .lp { font-size: 38px; font-weight: 900; margin-top: 2px; }
  .label svg { position: absolute; left: 26px; bottom: 18px; }
  .laser { position: absolute; left: -10px; right: -10px; height: 4px; background: #ef4444; box-shadow: 0 0 18px 4px rgba(239,68,68,.75); border-radius: 4px; }
  .okbadge { position: absolute; right: 18px; top: 18px; width: 54px; height: 54px; border-radius: 50%; background: var(--em); display: grid; place-items: center; box-shadow: 0 0 0 8px rgba(16,185,129,.2); }

  .phone { position: absolute; width: 340px; height: 708px; border-radius: 54px; background: #0b0f17; padding: 12px; box-shadow: 0 50px 100px rgba(0,0,0,.6), 0 0 0 2px #2a3140, inset 0 0 0 2px #3b4456; }
  .phone .scr { width: 316px; height: 684px; border-radius: 44px; overflow: hidden; position: relative; background: #fff; }
  .phone .scr img { width: 316px; position: absolute; left: 0; top: 0; }
  .phone .island { position: absolute; left: 50%; top: 22px; width: 96px; height: 28px; margin-left: -48px; border-radius: 20px; background: #000; z-index: 2; }

  .toast { position: absolute; display: flex; align-items: center; gap: 14px; padding: 18px 26px; border-radius: 18px; background: #ecfdf5; border: 2px solid #34d399; color: #065f46; font-size: 26px; font-weight: 700; box-shadow: 0 20px 50px rgba(0,0,0,.35); white-space: nowrap; }
  .steps { position: absolute; display: flex; gap: 10px; }
  .steps div { width: 120px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.14); overflow: hidden; }
  .steps div span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #10b981, #34d399); }
  .mlabel { position: absolute; font-size: 54px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  .confetti { position: absolute; width: 12px; height: 18px; border-radius: 3px; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const ASSETS = new URLSearchParams(location.search).get("assets") || ".";
const BOXES = window.BOXES || {};
const W = 1920, H = 1080;

// ------------------------------------------------------------------ yardımcılar
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: (p) => p,
  outCubic: (p) => 1 - Math.pow(1 - p, 3),
  inCubic: (p) => p * p * p,
  inOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  inExpo: (p) => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
  inOutExpo: (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2),
  outBack: (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  outElastic: (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
};
const P = (t, a, b, e = E.outCubic) => e(clamp((t - a) / (b - a)));
const win = (t, a, b) => t >= a && t < b;
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  (parent || stage).appendChild(e);
  return e;
}
const stage = document.getElementById("stage");
const S = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const tf = (e, x, y, s = 1, extra = "") => (e.style.transform = `translate(${x}px,${y}px) scale(${s}) ${extra}`);
let seed = 1234;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

// kelime kelime giren/çıkan metin
function kinetic(parent, html, cls) {
  const box = el("div", cls, parent);
  const words = [];
  for (const part of html.split(/(<br>)/)) {
    if (part === "<br>") { el("br", null, box); continue; }
    for (const w of part.split(" ").filter(Boolean)) {
      const o = el("span", "w", box);
      const i = el("span", "wi", o, w.replace(/\{(.+?)\}/g, '<span class="grad">$1</span>'));
      words.push(i);
      box.appendChild(document.createTextNode(" "));
    }
  }
  return { box, words };
}
function animWords(k, t, tIn, tOut, stagger = 0.055, dur = 0.55) {
  k.words.forEach((w, i) => {
    const a = P(t, tIn + i * stagger, tIn + i * stagger + dur, E.outExpo);
    const b = P(t, tOut + i * 0.025, tOut + i * 0.025 + 0.3, E.inCubic);
    w.style.transform = `translateY(${(1 - a) * 115 - b * 115}%) rotate(${(1 - a) * 6}deg)`;
  });
  k.box.style.visibility = t >= tIn - 0.05 && t < tOut + 0.6 ? "visible" : "hidden";
}

// ------------------------------------------------------------------ EAN-13 barkod (gerçek kodlama)
const EAN = {
  L: ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"],
  G: ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"],
  R: ["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"],
  P: ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"],
};
function eanSvg(code, w, h) {
  const d = code.split("").map(Number);
  let bits = "101";
  const par = EAN.P[d[0]];
  for (let i = 1; i <= 6; i++) bits += EAN[par[i - 1]][d[i]];
  bits += "01010";
  for (let i = 7; i <= 12; i++) bits += EAN.R[d[i]];
  bits += "101";
  const mw = w / bits.length;
  let rects = "";
  for (let i = 0; i < bits.length; i++) if (bits[i] === "1") rects += `<rect x="${(i * mw).toFixed(2)}" y="0" width="${(mw + 0.3).toFixed(2)}" height="${h - 24}" fill="#0f172a"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${rects}<text x="${w / 2}" y="${h - 2}" text-anchor="middle" font-size="22" font-family="ui-monospace,Menlo,monospace" letter-spacing="5" fill="#0f172a">${code}</text></svg>`;
}

// ------------------------------------------------------------------ simgeler (SVG)
const ICON = {
  scan: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>',
  box: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg>',
  chart: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  bolt: '<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
  wifi: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5h.01M3 3l18 18"/></svg>',
  lock: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>',
  check: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cursor: '<svg width="34" height="44" viewBox="0 0 34 44"><path d="M3 3 L3 34 L11 26 L17 40 L23 37 L17 24 L28 24 Z" fill="#fff" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/></svg>',
};

// ------------------------------------------------------------------ arka plan
const bg = el("div", "layer");
S(bg, { background: "radial-gradient(ellipse at 50% 40%, #0d1a2e 0%, #070d1a 55%, #04070e 100%)" });
const blobs = [
  ["rgba(16,185,129,.30)", 0.13, 0.0], ["rgba(6,182,212,.20)", 0.09, 2.1], ["rgba(245,158,11,.13)", 0.11, 4.2],
].map(([c, sp, ph]) => { const b = el("div", "blob", bg); b.style.background = `radial-gradient(circle, ${c} 0%, transparent 62%)`; return { b, sp, ph }; });
const grid = el("div", "grid", bg);
const dots = Array.from({ length: 46 }, () => ({ d: el("div", "dot", bg), x: rnd() * W, y: rnd() * H, v: 18 + rnd() * 40, s: 0.4 + rnd() * 0.9, ph: rnd() * 6 }));

// ------------------------------------------------------------------ tarayıcı bileşeni
function makeBrowser(parent, vw, url, shots) {
  const vh = Math.round(vw / 1.6);
  const root = el("div", "browser", parent);
  S(root, { width: vw + "px", height: vh + 46 + "px" });
  const bar = el("div", "bar", root, '<i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>');
  const u = el("div", "url", bar, "");
  const vp = el("div", "vp", root);
  S(vp, { width: vw + "px", height: vh + "px" });
  const cam = el("div", "cam", vp);
  const imgs = {};
  for (const s of shots) { const i = el("img", null, cam); i.src = `${ASSETS}/shots/${s}.png`; i.style.opacity = 0; imgs[s] = i; }
  const ov = el("div", "ov", vp);
  const b = { root, u, vp, cam, imgs, ov, w: vw, h: vh, k: { s: vw / 1440, tx: 0, ty: 0 } };
  setUrl(b, url);
  return b;
}
function setUrl(b, path) { if (b._url !== path) { b.u.innerHTML = `<svg width="12" height="14" viewBox="0 0 12 14"><rect x="1" y="6" width="10" height="7" rx="1.5" fill="#64748b"/><path d="M3 6V4a3 3 0 016 0v2" stroke="#64748b" stroke-width="1.6" fill="none"/></svg> localhost:3000<b>${path}</b>`; b._url = path; } }
function setShot(b, name) { for (const k in b.imgs) b.imgs[k].style.opacity = k === name ? 1 : 0; }
function setCam(b, rect, p, punch = 1) {
  const r = [0, 0, 1440, 900].map((v, i) => lerp(v, rect[i], p));
  const s = Math.min(b.w / r[2], b.h / r[3]) * punch;
  let tx = b.w / 2 - (r[0] + r[2] / 2) * s, ty = b.h / 2 - (r[1] + r[3] / 2) * s;
  tx = clamp(tx, b.w - 1440 * s, 0); ty = clamp(ty, b.h - 900 * s, 0);
  b.cam.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  b.k = { s, tx, ty };
}
const camLerp = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
const toView = (b, x, y) => [b.k.tx + x * b.k.s, b.k.ty + y * b.k.s];
function ring(b, cls) { const r = el("div", "ring " + (cls || ""), b.ov); r.style.opacity = 0; return r; }
function setRing(b, r, rect, op, pad = 8) {
  const [x0, y0] = toView(b, rect[0] - pad, rect[1] - pad);
  const [x1, y1] = toView(b, rect[0] + rect[2] + pad, rect[1] + rect[3] + pad);
  S(r, { left: x0 + "px", top: y0 + "px", width: x1 - x0 + "px", height: y1 - y0 + "px", opacity: op });
}
function makeCursor(b) {
  const c = el("div", "cursor", b.ov, ICON.cursor);
  const rp = el("div", "ripple", b.ov);
  return { c, rp };
}
// imleç: path = [[zaman, x, y], ...] uygulama koordinatı; clicks = [zaman...]
function driveCursor(b, cur, t, path, clicks, vis) {
  let x = path[0][1], y = path[0][2];
  for (let i = 1; i < path.length; i++) {
    const [t0, x0, y0] = path[i - 1], [t1, x1, y1] = path[i];
    if (t >= t1) { x = x1; y = y1; continue; }
    if (t > t0) { const p = E.inOutCubic((t - t0) / (t1 - t0)); x = lerp(x0, x1, p); y = lerp(y0, y1, p) - Math.sin(p * Math.PI) * 30; }
    break;
  }
  const [vx, vy] = toView(b, x, y);
  let press = 1, rip = -1;
  for (const ct of clicks) { if (win(t, ct - 0.06, ct + 0.12)) press = 0.82; if (win(t, ct, ct + 0.5)) rip = (t - ct) / 0.5; }
  S(cur.c, { left: vx + "px", top: vy + "px", opacity: vis, transform: `scale(${press})` });
  if (rip >= 0) S(cur.rp, { left: vx + 4 + "px", top: vy + 4 + "px", opacity: (1 - rip) * vis, transform: `scale(${1 + rip * 4})` });
  else cur.rp.style.opacity = 0;
}

// ------------------------------------------------------------------ SAHNE: giriş (logo)
const intro = el("div", "layer");
const glow = el("div", "abs", intro); S(glow, { width: "900px", height: "900px", borderRadius: "50%", background: "radial-gradient(circle, rgba(16,185,129,.45), transparent 60%)" });
const ringFx = el("div", "abs", intro); S(ringFx, { width: "300px", height: "300px", borderRadius: "50%", border: "3px solid rgba(52,211,153,.8)" });
const logo = el("img", "abs", intro); logo.src = `${ASSETS}/icon.png`; S(logo, { width: "260px", height: "260px", filter: "drop-shadow(0 30px 60px rgba(0,0,0,.5))" });
const title = el("div", "abs", intro); S(title, { width: "1920px", textAlign: "center", fontSize: "150px", fontWeight: "900", letterSpacing: "-0.035em" });
const letters = [];
"Market Kasa".split("").forEach((ch, i) => { const s = el("span", "wi", title, ch === " " ? "&nbsp;" : ch); if (i >= 7) s.classList.add("grad"); letters.push(s); });
const tagRow = el("div", "abs", intro); S(tagRow, { width: "1920px", display: "flex", justifyContent: "center", gap: "26px", top: "680px" });
const tagWords = ["Okut.", "Sat.", "Kazancını gör."].map((w, i) => { const s = el("div", null, tagRow, w); S(s, { display: "inline-block", fontSize: "60px", fontWeight: "800", color: i === 2 ? "#34d399" : "#fff", whiteSpace: "nowrap" }); return s; });

// ------------------------------------------------------------------ SAHNE: kanca
const hook = el("div", "layer");
const hook1 = kinetic(hook, "Küçük dükkânlar için", "abs");
S(hook1.box, { width: "1920px", textAlign: "center", top: "250px", fontSize: "52px", fontWeight: "600", color: "#cbd5e1" });
const hookWords = [["Barkodlu satış", ICON.scan], ["Stok", ICON.box], ["Kâr takibi", ICON.chart]].map(([w, ic]) => {
  const c = el("div", "abs", hook); S(c, { fontSize: "104px", fontWeight: "900", letterSpacing: "-0.03em", whiteSpace: "nowrap", display: "flex", alignItems: "center", gap: "26px" });
  c.innerHTML = `<span style="width:96px;height:96px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,#10b981,#047857);box-shadow:0 20px 40px rgba(16,185,129,.35)">${ic.replace(/width="26" height="26"/, 'width="54" height="54"')}</span>${w}`;
  return c;
});
const hook3 = kinetic(hook, "Tek programda, {kendi} {bilgisayarınızda.}", "abs");
S(hook3.box, { width: "1920px", textAlign: "center", top: "790px", fontSize: "50px", fontWeight: "700" });

// ------------------------------------------------------------------ SAHNE: adımlar (kalıcı tarayıcı)
const steps = el("div", "layer");
const digit = el("div", "bigdigit", steps, "1");
const persp = el("div", "persp", steps);
const B = makeBrowser(persp, 1280, "/login", ["login-pin-0", "login-pin-1", "login-pin-2", "login-pin-3", "login-pin-4", "kasa-0", "kasa-1", "kasa-2", "kasa-3", "kasa-4", "pay-0", "pay-1", "pay-done", "panel", "yonetim", "toplu-fiyat"]);
const ringA = ring(B), ringB = ring(B, "amber");
const cur = makeCursor(B);
const toast = el("div", "toast", B.ov, `<span style="width:34px;height:34px;border-radius:50%;background:#10b981;display:grid;place-items:center">${ICON.check.replace('width="30" height="30"', 'width="20" height="20"')}</span> 6 ürünün fiyatı güncellendi`);
const confetti = Array.from({ length: 70 }, () => {
  const c = el("div", "confetti", B.ov);
  c.style.background = ["#10b981", "#34d399", "#f59e0b", "#fbbf24", "#60a5fa", "#f472b6"][Math.floor(rnd() * 6)];

  if (!vis) return;
  const tagIn = P(t, 29.8, 30.2, E.outBack);
  S(moreTag, { left: "96px", top: "350px", transform: `scale(${tagIn})`, opacity: tagIn * (1 - P(t, 33.7, 33.95)) });
  MONT.forEach((m, i) => {
    const a = P(t, m.t0 - 0.25, m.t0 + 0.2, E.outExpo);
    const b = i < 3 ? P(t, m.t0 + 0.75, m.t0 + 1.0, E.inExpo) : P(t, 33.65, 34.0, E.inExpo);
    const on = win(t, m.t0 - 0.3, m.t0 + 1.05);
    m.wrap.style.display = on ? "block" : "none";
    m.lab.style.display = on ? "block" : "none";
    m.sub.style.display = on ? "block" : "none";
    if (!on) return;
    const x = 640 + (1 - a) * 1400 - b * 1600;
    const blur = (1 - a) * 18 + b * 22;
    S(m.b.root, { left: x + "px", top: "200px", transform: `rotateY(${-10 + (1 - a) * -25 + b * 25}deg) rotateX(3deg) scale(${0.9 + a * 0.05})`, filter: blur > 0.3 ? `blur(${blur}px)` : "none" });
    setCam(m.b, m.focus, P(t, m.t0, m.t0 + 1.0, E.inOutCubic) * 0.6 + 0.2);
    const la = P(t, m.t0 + 0.02, m.t0 + 0.35, E.outExpo);
    const lo = i < 3 ? P(t, m.t0 + 0.72, m.t0 + 0.9, E.inCubic) : P(t, 33.6, 33.85, E.inCubic);
    S(m.lab, { left: "96px", top: "430px", transform: `translate(${-lo * 140}px,${(1 - la) * 80}px)`, opacity: la * (1 - lo) });
    S(m.sub, { left: "100px", top: "512px", transform: `translate(${-lo * 100}px,${(1 - la) * 60}px)`, opacity: P(t, m.t0 + 0.1, m.t0 + 0.4) * (1 - lo) });
  });
}

function renderOutro(t) {
  const vis = t >= 33.8;
  outro.style.display = vis ? "block" : "none";
  if (!vis) return;
  const a = P(t, 34.0, 34.6, E.outBack);
  const pulse = win(t, 38.0, 38.6) ? 0.08 * (1 - (t - 38) / 0.6) : 0;
  tf(oGlow, W / 2 - 600, 330 - 600, 0.5 + a * 0.5 + 0.04 * Math.sin(t * 5) + pulse * 2);
  oGlow.style.opacity = P(t, 33.9, 34.5);
  tf(oLogo, W / 2 - 100, 170, a + pulse, `rotate(${(1 - a) * 20}deg)`);
  oLogo.style.opacity = P(t, 34.0, 34.2);
  const ta = P(t, 34.25, 34.85, E.outExpo);
  S(oTitle, { transform: `translateY(${400 + (1 - ta) * 60}px) scale(${1 + pulse})`, opacity: ta, letterSpacing: `${-0.035 + (1 - ta) * 0.08}em` });
  const cx = [W / 2 - 610, W / 2 - 185, W / 2 + 255];
  oChips.forEach((c, i) => {
    const ci = P(t, 35.0 + i * 0.5, 35.4 + i * 0.5, E.outBack);
    S(c, { transform: `translate(${cx[i]}px,${600 + (1 - ci) * 50}px) scale(${0.7 + ci * 0.3})`, opacity: P(t, 35.0 + i * 0.5, 35.15 + i * 0.5) });
  });
  const tg = P(t, 36.6, 37.2, E.outExpo);
  S(oTag, { transform: `translateY(${730 + (1 - tg) * 50}px) scale(${1 + pulse * 0.6})`, opacity: tg });
  S(oSmall, { transform: `translateY(${835 + (1 - P(t, 37.0, 37.5, E.outExpo)) * 30}px)`, opacity: P(t, 37.0, 37.4) });
}

function renderFX(t) {
  let f = 0;
  for (const [ft, a, d] of [[4.0, 0.55, 0.35], [8.0, 0.18, 0.25], [12.0, 0.12, 0.2], [18.0, 0.1, 0.2], [20.5, 0.18, 0.3], [22.0, 0.1, 0.2], [26.0, 0.16, 0.25], [30.0, 0.14, 0.2], [34.0, 0.5, 0.4], [38.0, 0.35, 0.5]]) {
    if (win(t, ft, ft + d)) f = Math.max(f, a * (1 - (t - ft) / d));
  }
  flash.style.opacity = f;
  fade.style.opacity = Math.max(1 - P(t, 0, 0.5), P(t, 39.0, 40.0, E.inCubic));
}

window.renderFrame = (t) => {
  renderBg(t);
  renderIntro(t);
  renderHook(t);
  renderSteps(t);
  renderMontage(t);
  renderOutro(t);
  renderFX(t);
};
window.ready = Promise.all([...document.images].map((i) => (i.complete ? Promise.resolve() : new Promise((r) => { i.onload = r; i.onerror = r; })))).then(() => document.fonts.ready);
renderFrame(Number(new URLSearchParams(location.search).get("t") || 0));
</script>
