<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Optiva Tanıtım</title>
<style>
  :root { --em: #10b981; --em2: #059669; --em3: #34d399; --amber: #fbbf24; --red: #f43f5e; --ink: #050912; --slate: #cbd5e1; --ca: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #03060c; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; }
  #world { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 50%; }
  .abs { position: absolute; left: 0; top: 0; }
  .layer { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; width: 1200px; height: 1200px; }
  .grid { position: absolute; inset: -200px; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 80px 80px; -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, transparent 72%); }
  .dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #a7f3d0; box-shadow: 0 0 12px #34d399; }
  .ca { text-shadow: calc(var(--ca) * 1px) 0 rgba(255, 0, 90, .65), calc(var(--ca) * -1px) 0 rgba(0, 220, 255, .65); }

  /* kinetik metin */
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.03em 0.16em; margin-bottom: -0.12em; }
  .wi { display: inline-block; will-change: transform; }
  .grad { background: linear-gradient(90deg, #6ee7b7, #10b981 45%, #fbbf24); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  .ktitle { font-weight: 850; letter-spacing: -0.03em; line-height: 1.02; }
  .sub { font-size: 30px; line-height: 1.4; color: var(--slate); font-weight: 450; }
  .pill { display: inline-flex; align-items: center; gap: 12px; height: 44px; padding: 0 20px 0 8px; border-radius: 999px; background: rgba(16,185,129,.14); border: 1px solid rgba(52,211,153,.45); color: #6ee7b7; font-weight: 800; letter-spacing: .16em; font-size: 17px; white-space: nowrap; }
  .pill .n { width: 30px; height: 30px; border-radius: 50%; background: var(--em); color: #03140d; display: grid; place-items: center; letter-spacing: 0; font-size: 16px; }

  /* uygulama penceresi */
  .persp { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 50% 45%; }
  .browser { position: absolute; border-radius: 18px; background: #fff; overflow: hidden; box-shadow: 0 60px 140px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.1), 0 0 160px rgba(16,185,129,.22); transform-origin: 50% 50%; }
  .bar { height: 42px; background: linear-gradient(#f3f5f9, #e6eaf0); display: flex; align-items: center; gap: 9px; padding: 0 16px; border-bottom: 1px solid #d9dee6; position: relative; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .bar .tt { position: absolute; left: 0; right: 0; text-align: center; color: #334155; font-size: 15px; font-weight: 600; pointer-events: none; }
  .vp { position: relative; overflow: hidden; background: #f1f5f9; }
  .cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
  .cam img { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; }
  .ov { position: absolute; inset: 0; pointer-events: none; }
  .glare { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.28) 48%, transparent 60%); mix-blend-mode: screen; }
  .ring { position: absolute; border: 4px solid var(--em); border-radius: 12px; box-shadow: 0 0 0 6px rgba(16,185,129,.18), 0 0 34px rgba(16,185,129,.6); }
  .ring.amber { border-color: var(--amber); box-shadow: 0 0 0 6px rgba(251,191,36,.2), 0 0 34px rgba(251,191,36,.6); }

  /* sayaç ve kartlar */
  .counter { position: absolute; }
  .counter .cl { font-size: 22px; font-weight: 800; letter-spacing: .2em; color: #94a3b8; }
  .counter .cv { font-size: 124px; font-weight: 900; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1.05; white-space: nowrap; transform-origin: 0 60%; }
  .kcard { position: absolute; width: 380px; height: 176px; border-radius: 26px; padding: 24px 28px; background: linear-gradient(160deg, rgba(30,41,59,.92), rgba(15,23,42,.92)); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 40px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12); backdrop-filter: blur(10px); }
  .kcard .kl { font-size: 22px; color: #94a3b8; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .kcard .kv { font-size: 58px; font-weight: 900; letter-spacing: -0.03em; margin-top: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kcard .bar2 { position: absolute; left: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, #10b981, #34d399); }
  .chip { position: absolute; display: flex; align-items: center; gap: 16px; height: 76px; padding: 0 30px 0 16px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); font-size: 32px; font-weight: 750; white-space: nowrap; backdrop-filter: blur(8px); }
  .chip .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, #10b981, #047857); flex: none; }
  .alert { position: absolute; display: flex; align-items: center; gap: 18px; height: 92px; padding: 0 30px 0 20px; border-radius: 22px; font-size: 32px; font-weight: 750; white-space: nowrap; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
  .alert .dotc { width: 22px; height: 22px; border-radius: 50%; flex: none; }

  /* barkod etiketi */
  .label { position: absolute; width: 420px; height: 222px; border-radius: 22px; background: #fff; color: #0f172a; box-shadow: 0 30px 60px rgba(0,0,0,.5); padding: 20px 24px; overflow: hidden; }
  .label .ln { font-size: 21px; font-weight: 700; }
  .label .lp { font-size: 36px; font-weight: 900; margin-top: 2px; }
  .label svg { position: absolute; left: 24px; bottom: 14px; }
  .laser { position: absolute; left: -10px; right: -10px; height: 4px; background: #ef4444; box-shadow: 0 0 18px 5px rgba(239,68,68,.8); border-radius: 4px; }
  .okbadge { position: absolute; right: 16px; top: 16px; width: 52px; height: 52px; border-radius: 50%; background: var(--em); display: grid; place-items: center; box-shadow: 0 0 0 8px rgba(16,185,129,.22); }
  .key { position: absolute; width: 104px; height: 104px; border-radius: 20px; background: linear-gradient(#ffffff, #e2e8f0); color: #0f172a; font-size: 42px; font-weight: 850; display: grid; place-items: center; }

  .phone { position: absolute; width: 360px; height: 750px; border-radius: 58px; background: #0b0f17; padding: 13px; box-shadow: 0 60px 120px rgba(0,0,0,.65), 0 0 0 2px #2a3140, inset 0 0 0 2px #3b4456; }
  .phone .scr { width: 334px; height: 724px; border-radius: 46px; overflow: hidden; position: relative; background: #fff; }
  .phone .scr img { width: 334px; position: absolute; left: 0; top: 0; }
  .phone .island { position: absolute; left: 50%; top: 24px; width: 100px; height: 30px; margin-left: -50px; border-radius: 20px; background: #000; z-index: 2; }
  .mail { position: absolute; width: 780px; height: 720px; border-radius: 22px; background: #fff; overflow: hidden; color: #0f172a; box-shadow: 0 60px 140px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.1); }
  .mail .mh { height: 118px; padding: 20px 26px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
  .mail .mh b { font-size: 24px; display: block; }
  .mail .mh span { font-size: 18px; color: #64748b; }
  .mail .mb { position: absolute; left: 30px; top: 136px; width: 720px; }

  .hcell { position: absolute; width: 64px; height: 64px; border-radius: 12px; }
  .hlab { position: absolute; font-size: 22px; color: #94a3b8; font-weight: 650; text-align: center; }
  .strike { position: absolute; height: 14px; border-radius: 8px; background: var(--red); box-shadow: 0 0 24px rgba(244,63,94,.8); transform-origin: 0 50%; }
  .shock { position: absolute; border-radius: 50%; border: 4px solid rgba(110,231,183,.9); box-shadow: 0 0 40px rgba(52,211,153,.7), inset 0 0 40px rgba(52,211,153,.4); }
  .spark { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #d1fae5; box-shadow: 0 0 14px 3px #34d399; }
  .confetti { position: absolute; width: 14px; height: 20px; border-radius: 3px; }
  .streak { position: absolute; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); }
  .sweep { position: absolute; -webkit-mask-image: linear-gradient(100deg, transparent 0%, transparent 42%, #000 50%, transparent 58%, transparent 100%); -webkit-mask-size: 300% 100%; color: #fff; }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #leak1, #leak2 { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; mix-blend-mode: screen; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.62) 100%); }
  #grain { position: absolute; inset: -100px; opacity: .07; mix-blend-mode: overlay; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<div id="world"></div>
<script>
"use strict";
const ASSETS = new URLSearchParams(location.search).get("assets") || ".";
const BOXES = window.BOXES || {};
const W = 1920, H = 1080;
const BT = 60 / 128, BAR = 4 * BT;

// ------------------------------------------------------------------ yardımcılar
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: (p) => p,
  outCubic: (p) => 1 - Math.pow(1 - p, 3),
  inCubic: (p) => p * p * p,
  inOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  inExpo: (p) => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
  inOutExpo: (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2),
  outBack: (p) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  outElastic: (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
};
const P = (t, a, b, e = E.outCubic) => e(clamp((t - a) / (b - a)));
const win = (t, a, b) => t >= a && t < b;
const world = document.getElementById("world");
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  (parent || world).appendChild(e);
  return e;
}
const S = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const show = (e, on) => { e.style.display = on ? (e.classList.contains("chip") || e.classList.contains("alert") ? "flex" : "block") : "none"; return on; };
let seed = 4321;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const TRY = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY" });
const fmt = (kurus) => TRY.format(Math.round(kurus) / 100);
const parseTRY = (s) => Math.round(Number(String(s).replace(/[^\d,]/g, "").replace(",", ".")) * 100);

// kelime kelime giren/çıkan metin
function kinetic(parent, html, cls, style) {
  const box = el("div", cls, parent);
  if (style) S(box, style);
  const words = [];
  for (const part of html.split(/(<br>)/)) {
    if (part === "<br>") { el("br", null, box); continue; }
    for (const w of part.split(" ").filter(Boolean)) {
      const o = el("span", "w", box);
      words.push(el("span", "wi", o, w.replace(/\{(.+?)\}/g, '<span class="grad">$1</span>')));
      box.appendChild(document.createTextNode(" "));
    }
  }
  return { box, words };
}
function animWords(k, t, tIn, tOut, stagger = 0.05, dur = 0.5) {
  const on = t >= tIn - 0.05 && t < tOut + 0.5;
  k.box.style.visibility = on ? "visible" : "hidden";
  if (!on) return;
  k.words.forEach((w, i) => {
    const a = P(t, tIn + i * stagger, tIn + i * stagger + dur, E.outExpo);
    const b = P(t, tOut + i * 0.02, tOut + i * 0.02 + 0.25, E.inCubic);
    w.style.transform = `translateY(${(1 - a) * 118 - b * 118}%) rotate(${(1 - a) * 7}deg) scale(${1 + (1 - a) * 0.15})`;
  });
}
function popIn(e, t, a, dur = 0.4, ease = E.outBack) { return P(t, a, a + dur, ease); }

// ------------------------------------------------------------------ EAN-13 barkod (gerçek kodlama)
const EAN = {
  L: ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"],
  G: ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"],
  R: ["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"],
  P: ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"],
};
function eanSvg(code, w, h) {
  const d = code.split("").map(Number);
  let bits = "101";
  const par = EAN.P[d[0]];
  for (let i = 1; i <= 6; i++) bits += EAN[par[i - 1]][d[i]];
  bits += "01010";
  for (let i = 7; i <= 12; i++) bits += EAN.R[d[i]];
  bits += "101";
  const mw = w / bits.length;
  let rects = "";
  for (let i = 0; i < bits.length; i++) if (bits[i] === "1") rects += `<rect x="${(i * mw).toFixed(2)}" y="0" width="${(mw + 0.3).toFixed(2)}" height="${h - 24}" fill="#0f172a"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${rects}<text x="${w / 2}" y="${h - 2}" text-anchor="middle" font-size="21" font-family="ui-monospace,Menlo,monospace" letter-spacing="5" fill="#0f172a">${code}</text></svg>`;
}

// ------------------------------------------------------------------ simgeler
const ic = (path, sw = 2.2) => `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
const ICON = {
  check: ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 3.2),
  coin: ic('<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.6-1-1.7-1.5-3-1.5-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.4 0-2.6-.6-3.1-1.6M12 6v2M12 16v2"/>'),
  trend: ic('<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>'),
  wallet: ic('<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14.5h2"/>'),
  spark: ic('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>'),
  user: ic('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'),
  basket: ic('<path d="M5 9h14l-1.5 10h-11z"/><path d="M9 9l3-5 3 5"/>'),
  undo: ic('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>'),
  clock: ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  win: ic('<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/>'),
  wifi: ic('<path d="M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5h.01M3 3l18 18"/>'),
  lock: ic('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>'),
};

// ------------------------------------------------------------------ arka plan
const bg = el("div", "layer");
S(bg, { background: "radial-gradient(ellipse at 50% 40%, #0c1a2c 0%, #060c18 55%, #03060c 100%)" });
const bgRed = el("div", "layer", bg); S(bgRed, { background: "radial-gradient(ellipse at 50% 50%, rgba(244,63,94,.18), transparent 65%)" });
const blobs = [["rgba(16,185,129,.32)", 0.13, 0.0], ["rgba(6,182,212,.22)", 0.09, 2.1], ["rgba(251,191,36,.12)", 0.11, 4.2]].map(([c, sp, ph]) => {
  const b = el("div", "blob", bg); b.style.background = `radial-gradient(circle, ${c} 0%, transparent 62%)`; return { b, sp, ph };
});
const grid = el("div", "grid", bg);
const dots = Array.from({ length: 60 }, () => ({ d: el("div", "dot", bg), x: rnd() * W, y: rnd() * H, v: 20 + rnd() * 50, s: 0.4 + rnd() * 1.0, ph: rnd() * 6 }));
const streaks = Array.from({ length: 26 }, () => ({ s: el("div", "streak", bg), y: rnd() * H, w: 300 + rnd() * 700, sp: 0.6 + rnd() * 0.8 }));

// ------------------------------------------------------------------ uygulama penceresi
function makeBrowser(parent, vw, title, shots) {
  const vh = Math.round(vw / 1.6);
  const root = el("div", "browser", parent);
  S(root, { width: vw + "px", height: vh + 42 + "px" });
  el("div", "bar", root, `<i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><div class="tt">${title}</div>`);
  const vp = el("div", "vp", root);
  S(vp, { width: vw + "px", height: vh + "px" });
  const cam = el("div", "cam", vp);
  const imgs = {};
  for (const s of shots) { const i = el("img", null, cam); i.src = `${ASSETS}/shots/${s}.png`; i.style.opacity = 0; imgs[s] = i; }
  const ov = el("div", "ov", vp);
  const glare = el("div", "glare", root);
  const b = { root, vp, cam, imgs, ov, glare, w: vw, h: vh, k: { s: vw / 1440, tx: 0, ty: 0 } };
  if (shots.length) setShot(b, shots[0]);
  return b;
}
function setShot(b, name) { if (b._shot === name) return; for (const k in b.imgs) b.imgs[k].style.opacity = k === name ? 1 : 0; b._shot = name; }
function setCam(b, rect, p = 1, punch = 1) {
  const r = [0, 0, 1440, 900].map((v, i) => lerp(v, rect[i], p));
  const s = Math.min(b.w / r[2], b.h / r[3]) * punch;
  let tx = b.w / 2 - (r[0] + r[2] / 2) * s, ty = b.h / 2 - (r[1] + r[3] / 2) * s;
  tx = clamp(tx, b.w - 1440 * s, 0); ty = clamp(ty, b.h - 900 * s, 0);
  b.cam.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  b.k = { s, tx, ty };
}
const camLerp = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
const toView = (b, x, y) => [b.k.tx + x * b.k.s, b.k.ty + y * b.k.s];
function ring(b, cls) { const r = el("div", "ring " + (cls || ""), b.ov); r.style.opacity = 0; return r; }
function setRing(b, r, rect, op, pad = 8) {
  if (!rect || op <= 0) { r.style.opacity = 0; return; }
  const [x0, y0] = toView(b, rect[0] - pad, rect[1] - pad);
  const [x1, y1] = toView(b, rect[0] + rect[2] + pad, rect[1] + rect[3] + pad);
  S(r, { left: x0 + "px", top: y0 + "px", width: x1 - x0 + "px", height: y1 - y0 + "px", opacity: op });
}
function place3d(b, x, y, { ry = 0, rx = 0, rz = 0, z = 0, s = 1, blur = 0, op = 1 } = {}) {
  S(b.root, { left: x + "px", top: y + "px", opacity: op, transform: `translateZ(${z}px) rotateY(${ry}deg) rotateX(${rx}deg) rotateZ(${rz}deg) scale(${s})`, filter: blur > 0.3 ? `blur(${blur}px)` : "none" });
}
function glareAt(b, t, t0) { const p = P(t, t0, t0 + 0.9, E.inOutCubic); S(b.glare, { transform: `translateX(${lerp(-120, 120, p)}%)`, opacity: p > 0 && p < 1 ? 1 : 0 }); }
const R = (shot, k, fb) => (BOXES[shot] && BOXES[shot][k]) || fb;

function caption(parent, { pill, n, title, size = 88, width = 640, sub }) {
  const box = el("div", "abs", parent);
  S(box, { width: width + "px" });
  const p = pill ? el("div", "pill", box, `<span class="n">${n}</span>${pill}`) : null;
  const tk = kinetic(box, title, "ktitle ca", { fontSize: size + "px", marginTop: pill ? "22px" : "0" });
  const sb = sub ? el("div", "sub", box, sub) : null;
  if (sb) sb.style.marginTop = "22px";
  return { box, p, tk, sb };
}
function animCaption(c, t, tIn, tOut, x, y) {
  const on = win(t, tIn - 0.1, tOut + 0.5);
  show(c.box, on);
  if (!on) return;
  S(c.box, { left: x + "px", top: y + "px" });
  const po = P(t, tOut, tOut + 0.25, E.inCubic);

    S(gFore, { left: w(tg.actual) - 4 + "px", width: Math.max(0, w(tg.forecast ?? tg.actual) - w(tg.actual)) * fc + 4 + "px", opacity: fc });
    S(gExp, { left: w(tg.expected ?? 0) + "px", opacity: P(t, 38.1, 38.25) });
    gNow.querySelector(".gv").textContent = fmt0(tg.actual * fp);
    gFlag.querySelector(".gv").textContent = fmt0(tg.target * P(t, 37.75, 38.3, E.outExpo));
    gFc.querySelector(".gv").textContent = fmt0((tg.forecast ?? tg.actual) * fc);
    S(gFc, { left: clamp(w(tg.forecast ?? tg.actual) - 330, 380, 880) + "px", opacity: fc });
  }
  aiChips.forEach((c, i) => {
    const p = P(t, 38.55 + i * 0.12, 38.85 + i * 0.12, E.outBack), o = P(t, 38.88, 39.02, E.inCubic);
    show(c, win(t, 38.5, 39.05));
    S(c, { transform: `translate(${[300, 790, 1270][i]}px,${800 + (1 - p) * 50}px) scale(${(0.6 + p * 0.4) * 0.82})`, opacity: P(t, 38.55 + i * 0.12, 38.7 + i * 0.12) * (1 - o) });
  });
  // --- "VE DAHASI" → karusel
  const mOn = t >= 38.95;
  show(aiMore, mOn);
  if (mOn) {
    aiMoreL.forEach((s, i) => {
      const ti = 38.98 + i * 0.03, a = P(t, ti, ti + 0.15, E.outExpo);
      s.style.transform = `translateY(${(1 - a) * 80}px) scale(${1.6 - a * 0.6})`;
      s.style.opacity = a;
    });
    const g = P(t, 39.15, 39.36, E.inCubic);
    S(aiMore, { transform: `scale(${1 + g * 0.5})`, filter: g > 0.4 ? `blur(${(g - 0.4) * 20}px)` : "none", opacity: 1 - P(t, 39.3, AIE) });
  }
}
function renderFxAI(t) {
  let f = 0;
  for (const [ft, a, d] of [[AIS, 0.95, 0.5], [33.75, 0.12, 0.25], [35.625, 0.12, 0.25], [37.5, 0.14, 0.3]]) if (win(t, ft, ft + d)) f = Math.max(f, a * Math.pow(1 - (t - ft) / d, 1.6));
  if (win(t, 39.1, AIE)) f = Math.max(f, P(t, 39.1, AIE, E.inCubic) * 0.9);
  flash.style.opacity = f;
  let x = 0, y = 0, amp = 0;
  for (const [t0, a, d] of [[AIS, 44, 0.4], [32.8125, 9, 0.2], [33.75, 6, 0.15], [35.625, 6, 0.15], [37.5, 8, 0.2], [38.4375, 6, 0.2]]) {
    if (t < t0 || t > t0 + d * 5) continue;
    const k = a * Math.exp(-(t - t0) / d);
    x += k * Math.sin((t - t0) * 87 + t0 * 3); y += k * Math.cos((t - t0) * 71 + t0 * 5); amp = Math.max(amp, k);
  }
  if (win(t, 38.95, AIE)) { const k = 10 * P(t, 38.95, AIE - 0.02, E.inCubic); x += k * Math.sin(t * 97); y += k * Math.cos(t * 83); amp = Math.max(amp, k); }
  const kp = aiKick(t);
  world.style.transform = `translate(${x}px,${y}px) scale(${1 + kp * 0.006 + (win(t, 38.95, AIE) ? P(t, 38.95, AIE) * 0.05 : 0)}) rotate(${x * 0.02}deg)`;
  document.documentElement.style.setProperty("--ca", Math.min(16, amp * 0.5 + kp * 1.5).toFixed(2));
  S(leak1, { transform: `translate(${-500 + Math.sin(t * 0.33) * 300}px,${-600 + Math.cos(t * 0.27) * 200}px)`, opacity: 0.45 + 0.2 * Math.sin(t * 0.7) });
  S(leak2, { transform: `translate(${1100 + Math.cos(t * 0.29) * 300}px,${300 + Math.sin(t * 0.31) * 200}px)`, opacity: 0.4 + 0.2 * Math.cos(t * 0.6) });
  grain.style.transform = `translate(${Math.floor(rndAt(t, 1) * 100)}px,${Math.floor(rndAt(t, 2) * 100)}px)`;
  fade.style.opacity = 0;
}

function applyRails(t) {
  const L = { s1, s2, s3, s4, s5 };
  const P2 = { s2: s2p, s3: s3p, s4: s4p, s5: s5p };
  const st = {};
  for (const k in L) st[k] = { x: 0, y: 0, b: 0 };
  for (const r of RAILS) {
    const p = P(t, r.t0, r.t0 + r.d, E.inOutExpo);
    const DX = r.dx * 2100, DY = r.dy * 1250, mb = Math.sin(p * Math.PI) * 9;
    if (t >= r.t0) { st[r.out].x += DX * p; st[r.out].y += DY * p; st[r.out].b = Math.max(st[r.out].b, mb); }
    if (t < r.t0 + r.d) { st[r.inn].x -= DX * (1 - p); st[r.inn].y -= DY * (1 - p); st[r.inn].b = Math.max(st[r.inn].b, mb); }
  }
  for (const k in L) {
    const { x, y, b } = st[k];
    // ön plan (yazılar) 1,15 kat, pencere 1 kat hızla kayar → derinlik
    L[k].style.transform = x || y ? `translate(${x * 1.15}px,${y * 1.15}px)` : "";
    L[k].style.filter = b > 0.4 ? `blur(${b}px)` : "none";
    if (P2[k]) P2[k].style.transform = x || y ? `translate(${-x * 0.15}px,${-y * 0.15}px)` : "";
  }
}

function renderS7(t) {
  if (!show(s7, t >= 37.45)) return;
  const cx = W / 2, cy = 250;
  shockAt(s7shocks, t, 37.5, cx, cy, 0.1, 1800);
  burst(s7sparks, t, 37.5, cx, cy, 1.4);
  const kp = kickPulse(t), fh = win(t, 41.25, 42.0) ? 1 - (t - 41.25) / 0.75 : 0;
  const a = P(t, 37.5, 37.95, E.outBack);
  S(s7glow, { transform: `translate(${cx - 700}px,${cy - 700}px) scale(${0.5 + a * 0.5 + kp * 0.05 + fh * 0.3})`, opacity: P(t, 37.5, 37.8) });
  S(s7logo, { transform: `translate(${cx - 95}px,${cy - 95}px) scale(${a * (1 + fh * 0.12)}) rotate(${(1 - a) * 30}deg)`, opacity: P(t, 37.5, 37.6) });
  const ta = P(t, 37.7, 38.25, E.outExpo);
  S(s7title, { transform: `translateY(${390 + (1 - ta) * 70}px) scale(${1 + fh * 0.05})`, opacity: ta, letterSpacing: `${-0.04 + (1 - ta) * 0.1}em` });
  const sw = P(t, 38.3, 39.0, E.inOutCubic);
  S(s7sweep, { transform: `translateY(390px) scale(${1 + fh * 0.05})`, WebkitMaskPosition: `${lerp(100, 0, sw)}% 0`, opacity: sw > 0 && sw < 1 ? 1 : 0 });
  // Satış · Stok · Finans · Ekip
  const widths = s7words.map((w) => w.e.offsetWidth || 160);
  const gap = 70;
  const total = widths.reduce((s, w) => s + w, 0) + gap * (widths.length - 1);
  let x = cx - total / 2;
  s7words.forEach((w, i) => {
    const p = P(t, w.t, w.t + 0.3, E.outBack);
    S(w.e, { left: x + "px", top: "600px", opacity: P(t, w.t, w.t + 0.08), transform: `translateY(${(1 - p) * 50}px) scale(${0.5 + p * 0.5 + (win(t, w.t, w.t + 0.2) ? 0.08 : 0)})` });
    if (i < s7dots.length) S(s7dots[i], { left: x + widths[i] + gap / 2 - 7 + "px", top: "634px", opacity: P(t, s7words[i + 1].t - 0.05, s7words[i + 1].t + 0.1), transform: `scale(${P(t, s7words[i + 1].t - 0.05, s7words[i + 1].t + 0.2, E.outBack)})` });
    x += widths[i] + gap;
  });
  animWords(s7cta, t, 41.25, 99, 0.07, 0.4);
  S(s7cta.box, { top: "735px", transform: `scale(${1 + fh * 0.06})` });
  const cxs = [cx - 640, cx - 190, cx + 250];
  s7chips.forEach((c, i) => {
    const p = P(t, 41.9 + i * 0.18, 42.3 + i * 0.18, E.outBack);
    S(c, { transform: `translate(${cxs[i]}px,${905 + (1 - p) * 50}px) scale(${(0.6 + p * 0.4) * 0.85})`, opacity: P(t, 41.9 + i * 0.18, 42.05 + i * 0.18) });
  });
}

function renderFX(t) {
  let f = 0;
  for (const [ft, a, d] of FLASH) if (win(t, ft, ft + d)) f = Math.max(f, a * Math.pow(1 - (t - ft) / d, 1.6));
  if (win(t, 31.6, 31.875)) f = Math.max(f, P(t, 31.6, 31.875, E.inCubic) * 0.9);
  if (win(t, 3.6, 3.75)) f = Math.max(f, P(t, 3.6, 3.75, E.inCubic) * 0.6);
  if (win(t, 37.25, 37.5)) f = Math.max(f, P(t, 37.25, 37.5, E.inCubic) * 0.85);
  flash.style.opacity = f;
  const sh = shake(t);
  const kp = kickPulse(t);
  const zoom = 1 + kp * 0.006 + (win(t, 30.0, 31.875) ? P(t, 30.0, 31.85, E.inCubic) * 0.05 : 0);
  world.style.transform = `translate(${sh.x}px,${sh.y}px) scale(${zoom}) rotate(${sh.x * 0.02}deg)`;
  document.documentElement.style.setProperty("--ca", Math.min(16, sh.amp * 0.5 + kp * 1.5).toFixed(2));
  const l1 = 0.35 + 0.25 * Math.sin(t * 0.7) + (FLASH.some(([ft]) => win(t, ft, ft + 0.6)) ? 0.25 : 0);
  S(leak1, { transform: `translate(${-500 + Math.sin(t * 0.33) * 300}px,${-600 + Math.cos(t * 0.27) * 200}px)`, opacity: t < 3.75 ? 0.15 : l1 });
  S(leak2, { transform: `translate(${1100 + Math.cos(t * 0.29) * 300}px,${300 + Math.sin(t * 0.31) * 200}px)`, opacity: t < 3.75 ? 0.1 : 0.3 + 0.2 * Math.cos(t * 0.6) });
  grain.style.transform = `translate(${Math.floor(rndAt(t, 1) * 100)}px,${Math.floor(rndAt(t, 2) * 100)}px)`;
  fade.style.opacity = Math.max(1 - P(t, 0, 0.25), P(t, 44.0, 45.0, E.inCubic));
}
const rndAt = (t, k) => { const x = Math.sin(Math.floor(t * 30) * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };

window.renderFrame = (t) => {
  if (t >= AIS && t < AIE) {
    // Yapay zekâ sahnesi: diğer sahneler gizli
    for (const l of [s0, s1, s2, s3, s4, s5, s6, s7]) show(l, false);
    renderBg(t, true);
    renderAI(t);
    renderFxAI(t);
    return;
  }
  show(sAI, false);
  const to = t >= AIE ? t - AID : t; // yapay zekâ sahnesinden sonraki sahneler eski zamanlarıyla
  renderBg(to);
  renderS0(to);
  renderS1(to);
  renderS2(to);
  renderS3(to);
  renderS4(to);
  renderS5(to);
  renderS6(to);
  renderS7(to);
  applyRails(to);
  renderFX(to);
};
window.ready = Promise.all([...document.images].map((i) => (i.complete ? Promise.resolve() : new Promise((r) => { i.onload = r; i.onerror = r; })))).then(() => document.fonts.ready);
renderFrame(Number(new URLSearchParams(location.search).get("t") || 0));
</script>
