<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Market Kasa logosu: "barkoddan filizlenen fidan". Barkod çizgilerinin ortasındaki boşluk (negatif alan)
       etiketten yukarı uzayıp filizin gövdesi olur; küçük nane yaprağı + büyüyen altın yaprak (kazanç).
       Anlam: her satış işletmeyi büyüten bir tohum. Renkler: zümrüt zemin, beyaz, altın (#f59e0b). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="mint" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <!-- macOS simge ızgarası: 824×824 yuvarlatılmış kare -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <g transform="translate(0 22)">
  <!-- gölge -->
  <g opacity=".22" transform="translate(0 14)" fill="#022c22">
    <rect x="262" y="476" width="500" height="324" rx="44"/>
    <path d="M497 480 C 497 410, 492 360, 504 298 L 534 298 C 524 360, 527 410, 527 480 Z"/>
  </g>

  <!-- barkod etiketi + filizin gövdesi (tek beyaz parça: gövde etiketten büyür) -->
  <rect x="262" y="476" width="500" height="324" rx="44" fill="#ffffff"/>
  <path d="M497 482 C 497 410, 492 360, 504 298 L 534 298 C 524 360, 527 410, 527 482 Z" fill="#ffffff"/>

  <!-- barkod çizgileri; ortadaki boşluk gövdenin kökü (negatif alan) -->
  <g fill="#0f172a">
    <rect x="336" y="530" width="14" height="186"/>
    <rect x="362" y="530" width="7" height="186"/>
    <rect x="380" y="530" width="21" height="186"/>
    <rect x="413" y="530" width="7" height="186"/>
    <rect x="432" y="530" width="14" height="186"/>
    <rect x="458" y="530" width="7" height="186"/>
    <rect x="476" y="530" width="21" height="186"/>
    <rect x="527" y="530" width="21" height="186"/>
    <rect x="559" y="530" width="7" height="186"/>
    <rect x="578" y="530" width="14" height="186"/>
    <rect x="604" y="530" width="7" height="186"/>
    <rect x="623" y="530" width="21" height="186"/>
    <rect x="655" y="530" width="7" height="186"/>
    <rect x="674" y="530" width="14" height="186"/>
  </g>
  <rect x="318" y="740" width="388" height="18" rx="9" fill="#cbd5e1"/>

  <!-- yapraklar: küçük nane yaprağı + büyüyen altın yaprak (kazanç) -->
  <path d="M508 404 C 470 330, 400 304, 330 318 C 352 384, 420 420, 508 404 Z" fill="url(#mint)"/>
  <path d="M508 404 C 460 380, 400 350, 352 330" fill="none" stroke="#047857" stroke-width="7" stroke-linecap="round" opacity=".55"/>
  <path d="M520 312 C 556 216, 640 168, 742 172 C 724 262, 640 322, 520 312 Z" fill="url(#gold)"/>
  <path d="M520 312 C 590 280, 650 230, 716 190" fill="none" stroke="#b45309" stroke-width="8" stroke-linecap="round" opacity=".55"/>
  </g>
</svg>
