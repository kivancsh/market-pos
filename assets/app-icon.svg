<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Optiva logosu: "altın yaprağa dönüşen fiş". Alt kısım kasa fişi (yazdırılmış satırlar, tırtıklı
       yırtık kenar) = her satış. Fiş yukarıda daralıp döner; arka yüzü altın bir yaprak olarak açılır.
       Anlam: her fişin arkasında büyüyen bir kazanç var. Renkler: zümrüt zemin, beyaz, altın (#f59e0b). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset=".4" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset=".22" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="twist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <g transform="translate(512 504) scale(1.04) translate(-512 -512) translate(-74 6)">
    <!-- gölge -->
    <g opacity=".22" fill="#022c22" transform="translate(0 16)">
      <path d="M380 600 C 430 570, 488 548, 506 522 L 540 528 C 556 556, 580 580, 600 600 L600 812 L578 840 L556 812 L534 840 L512 812 L490 840 L468 812 L446 840 L424 812 L402 840 L380 812 Z"/>
      <path d="M506 520 C 400 430, 470 230, 800 176 C 790 360, 680 500, 540 530 Z"/>
    </g>
    <!-- fiş: beyaz kâğıt, yukarıda daralıp dönüyor -->
    <path d="M380 600 C 430 570, 488 548, 506 522 L 540 528 C 556 556, 580 580, 600 600 L600 812 L578 840 L556 812 L534 840 L512 812 L490 840 L468 812 L446 840 L424 812 L402 840 L380 812 Z" fill="url(#paper)"/>
    <g fill="#cbd5e1">
      <rect x="412" y="648" width="118" height="16" rx="8"/>
      <rect x="412" y="686" width="156" height="16" rx="8"/>
      <rect x="412" y="724" width="98" height="16" rx="8"/>
    </g>
    <rect x="412" y="764" width="156" height="20" rx="10" fill="#0f172a"/>
    <!-- arka yüzü altın: yaprak -->
    <path d="M506 520 C 400 430, 470 230, 800 176 C 790 360, 680 500, 540 530 Z" fill="url(#gold)"/>
    <!-- dönme noktası: kâğıdın kenarı yaprağın tabanını sarar -->
    <path d="M506 522 C 520 500, 548 492, 566 498 C 556 512, 548 522, 540 530 Z" fill="url(#twist)"/>
    <!-- orta damar -->
    <path d="M548 512 C 610 420, 690 300, 786 190" fill="none" stroke="#fffbeb" stroke-width="10" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
